# Web-app op Netlify (woober.nl). Netlify bouwt bij elke push naar main.
[build]
  command = "npx expo export -p web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# woober.nl is het hoofddomein. Extra domeinen voeg je in Netlify toe als
# domeinalias en stuur je hier door naar woober.nl, boven de regel hieronder:
# [[redirects]]
#   from = "https://ander-domein.nl/*"
#   to = "https://woober.nl/:splat"
#   status = 301
#   force = true

# De web-app is één pagina (app.json: web.output "single"). Stuur elk adres
# naar index.html zodat Expo Router de juiste pagina toont.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
